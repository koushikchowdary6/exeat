# Agentleash policy for the offline finance demo.
# Northwind Books is fictional. Every address uses a reserved example domain.
# Unlisted tools, recipients, paths, URLs, and tables are denied.

version: 1

org:
  name: Northwind Books
  unit: Accounts payable

roles:
  - name: finance-reader
    description: Read invoices, vendor records, and files under the finance tree.
    tools:
      - ledger.read
      - ledger.query
      - files.read
    scopes:
      files:
        allow:
          - data/finance/**
        deny:
          - data/finance/**/*.raw
      tables:
        allow:
          - finance.invoices
          - finance.vendors

  - name: finance-analyst
    description: Reader, plus small internal payments and internal email.
    inherits: finance-reader
    tools:
      - ledger.transfer
      - email.send
      - http.get
    spend:
      currency: USD
      per_call: 1000
      per_day: 2500
      total: 10000
    recipients:
      domains:
        - northwind.example
      addresses:
        - ap@northwind.example
    scopes:
      urls:
        allow:
          - https://ledger.internal.example/**
    approvals:
      - name: large-transfer
        tools:
          - ledger.transfer
        when:
          arg: amount_usd
          gt: 700
        reason: Transfers above $700 need a person.

agents:
  - name: finance-assistant
    role: finance-analyst
    description: Scripted accounts-payable clerk for the offline demo.

  - name: finance-intern
    role: finance-analyst
    description: Same tools as the analyst, with a much lower spend ceiling.
    spend:
      per_call: 50
      per_day: 100
      total: 200
