# How the gate reads a tool call. Argument types are the contract:
# spend, path, url, table, and recipient are enforced. string is not.
# Reserved names (path, url, to, bcc, amount_usd, ...) stay sensitive even
# if this file tries to downgrade them.

version: 1

tools:
  - name: ledger.read
    description: Read one synthetic invoice.
    risk: low
    arguments:
      - name: invoice_id
        type: string
        required: true
      - name: path
        type: path
        required: true

  - name: ledger.query
    description: Query an allowed finance table.
    risk: medium
    arguments:
      - name: table
        type: table
        required: true
      - name: where
        type: string
        required: false

  - name: ledger.transfer
    description: Pay a vendor from the accounts-payable account.
    risk: high
    arguments:
      - name: amount_usd
        type: spend
        required: true
      - name: vendor_id
        type: string
        required: true
      - name: memo
        type: string
        required: false

  - name: email.send
    description: Send one email. The builtin backend does not touch a mail server.
    risk: high
    arguments:
      - name: to
        type: recipient
        required: true
      - name: subject
        type: string
        required: true
      - name: body
        type: string
        required: true

  - name: files.read
    description: Read a file inside an allowed scope.
    risk: medium
    arguments:
      - name: path
        type: path
        required: true

  - name: http.get
    description: Fetch a URL inside an allowed scope. The builtin backend does not use the network.
    risk: medium
    arguments:
      - name: url
        type: url
        required: true
