[project]
name = "exeat"
description = "The permission slip for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sai Pranay Kowshik Chowdary Sakhamuri" }]
keywords = ["agents", "authorization", "mcp", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0.1", "cryptography>=42"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "mkdocs>=1.6",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
exeat = "exeat.cli:main"

[tool.hatch.version]
path = "src/exeat/brand.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["exeat"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["exeat"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "agents", "langchain_core", "langchain_core.*", "crewai", "crewai.*", "crewai_tools"]
ignore_missing_imports = true
