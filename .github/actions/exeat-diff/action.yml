name: Exeat permission diff
description: >
  Compare an agent policy and tool manifest between two git refs.
  Comments a markdown table on the pull request, writes SARIF, and fails
  when an agent gains tools, spend, recipients, or scopes.
  Requires the package on PATH (pip install -e .).

inputs:
  base:
    description: Base git ref, usually the pull request base SHA.
    required: true
  head:
    description: Head git ref, usually the pull request head SHA.
    required: true
  policy:
    description: Policy path inside the repository.
    required: false
    default: examples/finance-assistant/agent-policy.yaml
  manifest:
    description: Tool manifest path inside the repository.
    required: false
    default: examples/finance-assistant/tool-manifest.yaml
  fail-on:
    description: Lowest severity that fails the job.
    required: false
    default: medium

outputs:
  sarif:
    description: Path of the SARIF file written in the workspace.
    value: ${{ steps.diff.outputs.sarif }}
  result:
    description: Exit code of the diff. 0 means no risky escalation.
    value: ${{ steps.diff.outputs.code }}

runs:
  using: composite
  steps:
    - name: Diff permissions
      id: diff
      shell: bash
      run: |
        set +e
        python -m exeat diff \
          --rev-base "${{ inputs.base }}" \
          --rev-head "${{ inputs.head }}" \
          --policy "${{ inputs.policy }}" \
          --manifest "${{ inputs.manifest }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --format markdown > permission-diff.md
        code=$?
        python -m exeat diff \
          --rev-base "${{ inputs.base }}" \
          --rev-head "${{ inputs.head }}" \
          --policy "${{ inputs.policy }}" \
          --manifest "${{ inputs.manifest }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --format sarif > permission-diff.sarif || true
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif=permission-diff.sarif" >> "$GITHUB_OUTPUT"
        delimiter="EXEAT_DIFF_END"
        {
          echo "body<<${delimiter}"
          cat permission-diff.md
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        exit 0

    - name: Comment on the pull request
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        DIFF_BODY: ${{ steps.diff.outputs.body }}
      with:
        script: |
          const marker = "<!-- exeat-permission-diff -->";
          const body = marker + "\n\n" + (process.env.DIFF_BODY || "No diff output.");
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((comment) => (comment.body || "").includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: permission-diff.sarif

    - name: Fail on risky escalation
      if: steps.diff.outputs.code != '0'
      shell: bash
      run: exit 1
