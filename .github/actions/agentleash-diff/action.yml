name: Agentleash permission diff
description: >
  Compare an agent policy and tool manifest between two git refs and fail
  when an agent gains tools, spend, recipients, or scopes. Requires
  `agentleash` on PATH (pip install -e . in this repo).

inputs:
  base:
    description: Base git ref, usually the pull request base SHA.
    required: true
  head:
    description: Head git ref, usually the pull request head SHA.
    required: true
  policy:
    description: Policy path inside the repository.
    required: false
    default: examples/finance-assistant/agent-policy.yaml
  manifest:
    description: Tool manifest path inside the repository.
    required: false
    default: examples/finance-assistant/tool-manifest.yaml
  fail-on:
    description: Lowest severity that fails the job. high, medium, low, or note.
    required: false
    default: medium

runs:
  using: composite
  steps:
    - name: Diff permissions
      id: diff
      shell: bash
      run: |
        set +e
        output=$(python -m agentleash diff \
          --rev-base "${{ inputs.base }}" \
          --rev-head "${{ inputs.head }}" \
          --policy "${{ inputs.policy }}" \
          --manifest "${{ inputs.manifest }}" \
          --fail-on "${{ inputs.fail-on }}")
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        delimiter="AGENTLEASH_DIFF_END"
        {
          echo "body<<${delimiter}"
          printf '%s\n' "$output"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        exit 0

    - name: Comment on the pull request
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        DIFF_BODY: ${{ steps.diff.outputs.body }}
      with:
        script: |
          const marker = "<!-- agentleash-permission-diff -->";
          const body = marker + "\n\n```\n" + (process.env.DIFF_BODY || "(no diff output)") + "\n```\n";
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((comment) => (comment.body || "").includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail on risky escalation
      if: steps.diff.outputs.code != '0'
      shell: bash
      run: exit 1
