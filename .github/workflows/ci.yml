name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Test
        run: pytest --cov=agentleash --cov-fail-under=85
      - name: Demo
        run: python -m agentleash demo --audit /tmp/agentleash-audit.jsonl --approvals /tmp/agentleash-approvals.jsonl
      - name: Escalation fixture fails the diff
        shell: bash
        run: |
          set +e
          python -m agentleash diff --example escalation
          test $? -eq 1
      - name: Narrowing fixture passes the diff
        run: python -m agentleash diff --example narrowing
