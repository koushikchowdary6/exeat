name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Test
        run: pytest --cov=exeat --cov-fail-under=90
      - name: Docs
        run: mkdocs build --strict
      - name: Demo
        run: python -m exeat demo --audit /tmp/exeat-audit.jsonl --approvals /tmp/exeat-approvals.jsonl
      - name: Policy cases
        run: python -m exeat test examples/finance-assistant/policy-tests.yaml
      - name: Escalation fixture fails the diff
        shell: bash
        run: |
          set +e
          python -m exeat diff --example escalation
          test $? -eq 1
      - name: Narrowing fixture passes the diff
        run: python -m exeat diff --example narrowing
