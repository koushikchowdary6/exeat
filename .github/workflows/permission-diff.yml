name: Permission diff

on:
  pull_request:
    paths:
      - "examples/finance-assistant/**"
      - "agent-policy.yaml"
      - "tool-manifest.yaml"
      - ".github/workflows/permission-diff.yml"
      - ".github/actions/exeat-diff/**"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Exeat
        run: python -m pip install -e .
      - name: Compare the finance policy
        uses: ./.github/actions/exeat-diff
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          policy: examples/finance-assistant/agent-policy.yaml
          manifest: examples/finance-assistant/tool-manifest.yaml
          fail-on: medium
